name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y unixodbc
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m 'not integration' --junitxml=artifacts/offline.xml
  sql-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m scripts.init_local
      - run: docker compose --progress quiet --profile test run --build --rm tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: artifacts/
      - if: always()
        run: docker compose down -v
