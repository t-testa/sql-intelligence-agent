name: sql-intelligence-agent
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_ADMIN_PASSWORD:?Run python -m scripts.init_local}
    ports:
      - "127.0.0.1:14339:1433"
    volumes:
      - sql-data:/var/opt/mssql
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s
  migrate:
    profiles: ["app", "test"]
    build: .
    env_file: .env
    environment:
      SQL_HOST: sqlserver
      SQL_PORT: 1433
    command: ["python", "-m", "scripts.bootstrap_db"]
    depends_on:
      sqlserver:
        condition: service_healthy
  backend:
    profiles: ["app"]
    build: .
    # No admin password is passed to the runtime service.
    environment:
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN}
      SQL_PASSWORD: ${SQL_PASSWORD}
      SQL_HOST: sqlserver
      SQL_PORT: 1433
      AGENT_MODE: mock
    command: ["uvicorn", "backend.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  frontend:
    profiles: ["app"]
    build: .
    environment:
      LOCAL_API_TOKEN: ${LOCAL_API_TOKEN}
      API_URL: http://backend:8000
    command: ["python", "-m", "streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
  tests:
    profiles: ["test"]
    build: .
    user: "0:0"
    env_file: .env
    environment:
      SQL_HOST: sqlserver
      SQL_PORT: 1433
      RUN_SQL_INTEGRATION: "1"
      AGENT_MODE: mock
      AZURE_OPENAI_ENDPOINT: ""
      AZURE_OPENAI_DEPLOYMENT: ""
      AZURE_OPENAI_API_KEY: ""
    volumes:
      - ./tests:/app/tests:ro
      - ./evaluation:/app/evaluation:ro
      - ./requirements-dev.lock:/tmp/dev.lock:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./artifacts:/app/artifacts
    command: ["sh", "-c", "pip install -r /tmp/dev.lock && python -m scripts.bootstrap_validation && pytest -q --junitxml=artifacts/tests.xml && python -m scripts.evaluate"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  sql-data:
